name: validate-wiki

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # 2026-09-27：必須含 labeled——否則「CI 先紅 → 貼 kaecer-reviewed 標籤」不會重跑，
    # governance-review-gate 會永久停在 failure，PR 卡在 BLOCKED（enforce_admins=true 無法繞）。
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # 2026-09-28：送出 review **不會**觸發 pull_request 事件 ⇒ 少了這段，App 核准後閘門不會重跑
  # （會永遠停在 BLOCKED，逼人用 --admin）。dismissed 用於「撤銷核准」也要重算。
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read   # 讀 PR reviews（判斷核准者身分）
  issues: read          # 讀 PR timeline（判斷貼標籤的 actor）

jobs:
  governance-review-gate:
    name: 治理檔變更需 kaecer-reviewed 標籤（§6.4.2）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 檢查治理檔變更是否有 review 標籤
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail
          # 已合併的 PR（例如合併後移除標籤觸發）⇒ 早退，避免無意義的紅燈與通知
          if [ "${MERGED:-}" = "true" ]; then
            echo "ℹ️  PR 已合併 ⇒ 本閘門不再適用，通過"
            exit 0
          fi
          # 非 PR 事件（push 到 main）⇒ 本閘門不適用；仍回報成功狀態，避免 required check 卡住
          if [ -z "${BASE_SHA:-}" ]; then
            echo "ℹ️  非 PR 事件 ⇒ 治理檔 review 閘門不適用，通過"
            exit 0
          fi
          # 治理檔清單＝單一來源；規則（2026-09-28 審查 F2 + 死結修正）：
          #   ① 清單檔路徑**寫死**於此（不可由清單內容移除 ⇒ 刪檔也會被攔）
          #   ② 取 base ∪ head：head 刪掉某行不得解除保護
          #   ③ base 版取不到 ⇒ **視為空集合**（否則「引進本檔的 PR」自我死結：
          #      貼標籤也無法轉綠，只能 --admin override，正是 §6.4.2 要防的動作）
          LIST=skills/_scripts/governance-files.txt
          HARD='skills/_scripts/governance-files\.txt'
          git show "$BASE_SHA:$LIST" > /tmp/gov-base.txt 2>/dev/null || : > /tmp/gov-base.txt
          { cat /tmp/gov-base.txt; cat "$LIST" 2>/dev/null || true; } > /tmp/gov.txt
          GOV_RE="^(${HARD}|$(grep -vE '^[[:space:]]*(#|$)' /tmp/gov.txt | sort -u | paste -sd'|' -))"
          # --name-status -M：rename 同時給舊路徑與新路徑（--name-only 只給新路徑 ⇒ 改名可繞過）
          CHANGED="$(git diff --name-status -M "$BASE_SHA" HEAD | awk -F'\t' 'NF>1 {for (i=2; i<=NF; i++) print $i}')"
          GOV="$(printf '%s\n' "$CHANGED" | grep -E "$GOV_RE" || true)"
          if [ -z "$GOV" ]; then
            echo "✅ 未觸碰治理檔 ⇒ 免標籤"
            exit 0
          fi
          echo "觸碰治理檔（§6.4.2 重大變更）："
          printf '  - %s\n' $GOV

          # === 身分檢查（2026-09-28）：審查必須來自**獨立身分** atlas-qc-reviewer[bot] ===
          # 為什麼：所有 agent 共用 kaecer68 一個 GitHub 身分 ⇒ 作者自貼標籤不算審查。
          # 通過條件（任一）：① 標籤存在且最後一次 labeled 的 actor = App bot；
          #                   ② 最後一個 APPROVED review 的 reviewer = App bot。
          # 解析失敗一律 fail-closed（PARSE_ERROR ⇒ 紅燈），不得變成空值放行。
          APP_LOGIN="atlas-qc-reviewer[bot]"
          API="${GITHUB_API_URL:-https://api.github.com}"
          REPO="${GITHUB_REPOSITORY}"
          PR_NUM="${{ github.event.pull_request.number }}"
          AUTH="Authorization: Bearer ${GITHUB_TOKEN}"
          LABELJQ="import sys,json;d=json.load(sys.stdin);L=[x for x in d if x.get('event')=='labeled' and ((x.get('label') or {}).get('name') if isinstance(x.get('label'),dict) else x.get('label'))=='kaecer-reviewed'];print(((L[-1].get('actor') or {}).get('login','')) if L else '')"
          REVIEWJQ="import sys,json;d=json.load(sys.stdin);A=[x for x in d if x.get('state')=='APPROVED'];print(((A[-1].get('user') or {}).get('login','')) if A else '')"
          labeler=$(curl -fsS -H "$AUTH" -H 'Accept: application/vnd.github+json' "$API/repos/$REPO/issues/$PR_NUM/timeline?per_page=100" | python3 -c "$LABELJQ") || labeler=PARSE_ERROR
          approver=$(curl -fsS -H "$AUTH" -H 'Accept: application/vnd.github+json' "$API/repos/$REPO/pulls/$PR_NUM/reviews?per_page=100" | python3 -c "$REVIEWJQ") || approver=PARSE_ERROR
          has_label=$(printf '%s' "$LABELS" | tr ',' '\n' | grep -cx 'kaecer-reviewed' || true)
          echo "  標籤存在=${has_label:-0}｜標籤 actor=${labeler:-（無）}｜APPROVED by=${approver:-（無）}"
          if { [ "${has_label:-0}" = "1" ] && [ "$labeler" = "$APP_LOGIN" ]; } || [ "$approver" = "$APP_LOGIN" ]; then
            echo "✅ 已由 $APP_LOGIN 審查（標籤或核准）⇒ 可合併（仍需人工執行 merge）"
          else
            echo "::error::觸碰治理檔需由 ${APP_LOGIN} 貼 kaecer-reviewed 或核准（§6.4.2）；作者側自貼不算"
            exit 1
          fi

  validate-timestamp-rule:
    name: 第 5 條鐵律 timestamp 驗證
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 跑 validate-timestamp-rule.py
        run: python3 skills/_scripts/validate-timestamp-rule.py --skills-dir skills --all-classes

  audit-atlas-endpoints:
    name: atlas-mcp 端點 audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: checkout atlas-go(public,只取 mcp server 源碼)
        uses: actions/checkout@v5
        with:
          repository: kaecer68/atlas-go
          path: atlas-go
          sparse-checkout: |
            cmd/atlas-mcp/server
            internal/narrative
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: detector 數對齊（wiki ↔ atlas-go 權威值）
        run: python3 skills/_scripts/check-detector-count-sync.py --atlas-go-dir atlas-go
      - name: 執行 audit 並驗證輸出
        run: |
          OUT=$(python3 skills/_scripts/audit-atlas-endpoints.py --atlas-mcp-dir atlas-go/cmd/atlas-mcp/server 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -q "audit 完成"; then
            echo "✅ audit 正常完成"
          else
            echo "❌ audit 未完成"
            exit 1
          fi

  skill-structure-check:
    name: "SK 結構檢查（SSOT: skill-page-schema.json）"
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 —— R3 需對 PR base SHA 做 git diff；淺層（預設 1）會失敗
      # （2026-09-28 CI 實測：fatal: Invalid symmetric difference expression）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 段名／段序／重複段／禁用標記（失敗輸出最小重構處方）
        run: python3 skills/_scripts/check-skill-structure.py --skills-dir skills
      - name: size + frontmatter 10 欄 + YAML 合法 + L3 覆蓋率門檻（2026-09-27 kaecer 拍板 ≥90%）
        run: python3 skills/_scripts/check-skill-pages.py --skills-dir skills --min-l3-coverage 90
      - name: 檢索性完整性 S5（載入條件／索引／入口可達性；2026-09-27 升硬門檻）
        run: python3 skills/_scripts/check-retrieval-integrity.py --strict
      - name: 非 SK 類頁面 schema（S2；concepts／entities／summaries／templates／docs）
        run: python3 skills/_scripts/check-wiki-pages.py
      - name: 禁用句型（S7；synthetic→in-sample／零值須說明／401 須提 key）
        run: python3 skills/_scripts/check-claim-rules.py
      - name: 外部事實來源可追溯性（S3；strict）
        run: python3 skills/_scripts/check-source-tiers.py --strict
      - name: 時效宣告與逾期（S6；strict）
        run: python3 skills/_scripts/check-freshness.py --strict
      - name: shell「$VAR 緊接非 ASCII」（2026-09-28 新增；會 unbound 中止的 bug）
        run: python3 skills/_scripts/check-shell-var-ascii.py --strict
      - name: 護欄自測（每個護欄的失敗情境都要實跑；S8 機械化）
        run: python3 skills/_scripts/check-guard-teeth.py
      - name: skills 索引同步 R3（repo-only ＋ 對 PR base SHA 取變更集）
        run: python3 skills/_scripts/check-skill-index-sync.py --repo-only --base-ref "${{ github.event.pull_request.base.sha || github.event.before }}"
  size-check:
    name: SK 頁大小檢查(≤ 9000 bytes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 每頁 wc -c ≤ 9000
        run: |
          python3 - <<'EOF'
          import glob, os, sys
          # SK 頁:嚴格 ≤ 9000
          sk_files = sorted(glob.glob('skills/SK-*.md'))
          sk_bad = []
          for f in sk_files:
              size = len(open(f, 'rb').read())
              if size > 9000:
                  sk_bad.append((f, size))
          # _inbox.md:警告不失敗(_method §第七條例外 2026-08-07 kaecer 拍板)
          inbox_warn = []
          inbox_path = 'skills/_inbox.md'
          if os.path.exists(inbox_path):
              inbox_size = len(open(inbox_path, 'rb').read())
              if inbox_size > 12000:
                  inbox_warn.append((inbox_path, inbox_size))
          # 輸出
          if sk_bad:
              for f, s in sk_bad:
                  print(f'❌ {f}: {s} bytes > 9000')
              sys.exit(1)
          print(f'✅ {len(sk_files)} 頁 SK 全 ≤ 9000 bytes')
          if inbox_warn:
              for f, s in inbox_warn:
                  print(f'⚠️ {f}: {s} bytes > 12000(警告;不在 SK 嚴格檢查門內)')
          else:
              inbox_msg = len(open(inbox_path, 'rb').read()) if os.path.exists(inbox_path) else 0
              print(f'✅ _inbox.md = {inbox_msg} bytes ≤ 12000')
          EOF

  frontmatter-check:
    name: frontmatter 核心欄位檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: frontmatter 10 欄齊全
        run: |
          python3 - <<'EOF'
          import glob, re, sys
          REQUIRED = ['title', 'type', 'source', 'ingested_at', 'status', 'tier',
                      'confidence', 'atlas_go_relevance', 'mcp_tools_used', 'verification']
          files = sorted(glob.glob('skills/SK-*.md'))
          bad = []
          for f in files:
              content = open(f, encoding='utf-8').read()
              m = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
              if not m:
                  bad.append((f, '無 frontmatter'))
                  continue
              fm = m.group(1)
              missing = [k for k in REQUIRED if not re.search(rf'^{re.escape(k)}:', fm, re.MULTILINE)]
              if missing:
                  bad.append((f, '缺: ' + ', '.join(missing)))
          if bad:
              for f, msg in bad:
                  print(f'❌ {f}: {msg}')
              sys.exit(1)
          print(f'✅ {len(files)} 頁 frontmatter 核心欄位齊全')
          EOF

  audit-file-index-sync:
    name: wiki 內檔索引同步驗證(SK/concept/entities/triggers/scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 跑 audit-file-index-sync.py
        run: |
          OUT=$(python3 skills/_scripts/audit-file-index-sync.py 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -q "❌"; then
            echo "❌ audit-file-index-sync 發現未索引檔(詳見上方)"
            exit 1
          fi
          if echo "$OUT" | grep -q "✅ 所有 wiki 內檔均已索引"; then
            echo "✅ audit-file-index-sync 全綠"
          fi

  trigger-template-existence:
    name: 12 觸發模板存在 + 結構合規
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 驗證 12 觸發模板
        run: |
          python3 - <<'EOF'
          import os, sys
          expected = [
              'trigger-nvda-tsm.md',
              'trigger-usd-twd-32.md',
              'trigger-dxy-us10y-weak.md',
              'trigger-margin-350b.md',
              'trigger-foreign-3day-inflow.md',
              'trigger-sox-foreignflow.md',
              'trigger-taiwan-strait-tension.md',
              'trigger-china-slowdown.md',
              'trigger-tariff-shock.md',
              'trigger-etf-rebalance.md',
              'trigger-cb-fx-intervention.md',
              'trigger-retail-margin-decrease.md',
          ]
          templates_dir = 'templates'
          missing = []
          for t in expected:
              path = os.path.join(templates_dir, t)
              if not os.path.exists(path):
                  missing.append(t)
          if missing:
              for m in missing:
                  print(f'❌ 缺 {m}')
              sys.exit(1)
          print(f'✅ 12 觸發模板全在 {templates_dir}/')
          # 驗證每個含關鍵字
          for t in expected:
              with open(os.path.join(templates_dir, t)) as f:
                  content = f.read()
              keywords = ['觸發條件', '對位', '端點']
              missing_kw = [k for k in keywords if k not in content]
              if missing_kw:
                  print(f'❌ {t} 缺關鍵字: {missing_kw}')
                  sys.exit(1)
          print('✅ 12 觸發模板結構合規(觸發條件/對位/端點 5 段)')
          EOF

  trigger-endpoint-validation:
    name: 12 觸發模板對位 atlas 端點
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: checkout atlas-go(只取 mcp server)
        uses: actions/checkout@v5
        with:
          repository: kaecer68/atlas-go
          path: atlas-go
          sparse-checkout: |
            cmd/atlas-mcp/server
            internal/narrative
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 驗證模板對位端點存在
        run: |
          python3 - <<'EOF'
          import os, re, sys
          # 抓 atlas-go 所有 tool 端點名
          atlas_dir = 'atlas-go/cmd/atlas-mcp/server'
          if not os.path.exists(atlas_dir):
              print(f'❌ atlas-go 未 checkout,跳過驗證')
              sys.exit(1)
          files = sorted([f for f in os.listdir(atlas_dir) if f.startswith('tools_') and f.endswith('.go')])
          atlas_endpoints = set()
          for f in files:
              with open(os.path.join(atlas_dir, f)) as fh:
                  c = fh.read()
              for m in re.findall(r'Name:\s*"([a-z_]+)"', c):
                  atlas_endpoints.add(m)
          print(f'atlas-go 端點數: {len(atlas_endpoints)}')
          # 12 觸發模板對位端點
          template_endpoints = {
              'trigger-nvda-tsm.md': ['macro_get_snapshot_latest'],
              'trigger-usd-twd-32.md': ['macro_get_snapshot_latest'],
              'trigger-dxy-us10y-weak.md': ['macro_get_snapshot_latest'],
              'trigger-margin-350b.md': ['macro_get_snapshot_latest', 'risk_get_metrics'],
              'trigger-foreign-3day-inflow.md': ['capital_flow_summary', 'mcp_quickstart'],
              'trigger-sox-foreignflow.md': ['macro_get_snapshot_latest', 'capital_flow_summary'],
              'trigger-taiwan-strait-tension.md': ['macro_get_stress_index_current', 'capital_flow_summary'],
              'trigger-china-slowdown.md': ['macro_get_snapshot_latest', 'risk_exposure'],
              'trigger-tariff-shock.md': ['macro_get_snapshot_latest', 'capital_flow_summary'],
              'trigger-etf-rebalance.md': ['macro_get_snapshot_latest', 'event_calendar'],
              'trigger-cb-fx-intervention.md': ['macro_get_snapshot_latest', 'capital_flow_summary'],
              'trigger-retail-margin-decrease.md': ['macro_get_snapshot_latest', 'risk_get_metrics'],
          }
          templates_dir = 'templates'
          bad = []
          for t, eps in template_endpoints.items():
              path = os.path.join(templates_dir, t)
              if not os.path.exists(path):
                  continue
              with open(path) as f:
                  content = f.read()
              for ep in eps:
                  if ep not in content:
                      bad.append(f'{t} 缺端點 {ep}')
                  if ep not in atlas_endpoints:
                      bad.append(f'{t} 端點 {ep} 在 atlas-go 不存在')
          if bad:
              for b in bad:
                  print(f'❌ {b}')
              sys.exit(1)
          print(f'✅ 12 觸發模板對位 atlas 端點全在')
          EOF

  notify-telegram:
    name: 失敗 Telegram 通知
    needs: [governance-review-gate, validate-timestamp-rule, audit-atlas-endpoints, size-check, frontmatter-check, audit-file-index-sync, trigger-template-existence, trigger-endpoint-validation, skill-structure-check]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: 發送 Telegram 通知
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ]; then
            echo "⚠️ TELEGRAM_BOT_TOKEN 未設定(需在 GitHub Settings → Secrets 設定),跳過通知"
            exit 0
          fi
          CHAT_ID="${TG_CHAT_ID:-8387647295}"
          MSG=$(printf '❌ atlas-wiki CI 失敗 | 動作: %s | 提交: %s | 觸發: %s | 詳情: %s/actions/runs/%s' "${{ github.workflow }}" "${{ github.sha }}" "${{ github.event_name }}" "${{ github.server_url }}/${{ github.repository }}" "${{ github.run_id }}")
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true" \
            || echo "⚠️ Telegram 發送失敗(不使 job 失敗)"
